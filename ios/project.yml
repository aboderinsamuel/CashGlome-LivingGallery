# Backup only. CashGlome.xcodeproj is already here; use this if Xcode ever refuses to open it:
#   brew install xcodegen && cd ios && xcodegen
name: CashGlome
options:
  bundleIdPrefix: app.cashglome
  deploymentTarget:
    iOS: "18.0"
targets:
  CashGlome:
    type: application
    platform: iOS
    sources: [CashGlome]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cashglome.ios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: CashGlome
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
